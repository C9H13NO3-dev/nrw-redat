<div class="flex items-center gap-4">
    <span class="px-3 py-1 rounded-full font-bold" :class="$store.app.getFloodRiskClass(d.flood_risk_level)" x-text="d.flood_risk_level"></span>
    <div class="text-sm">
        <div class="text-gray-500">Hochwasserzone</div>
        <div class="font-medium text-gray-900" x-text="d.flood_zone || 'keine (außerhalb aller Szenarien)'"></div>
    </div>
</div>
<table class="mt-4 w-full text-sm">
    <thead><tr class="text-left text-gray-500"><th class="py-1">Szenario</th><th class="py-1">Betroffen</th><th class="py-1">Abstand</th></tr></thead>
    <tbody>
        <template x-for="sc in ['HQhaeufig', 'HQ100', 'HQextrem']" :key="sc">
            <tr class="border-t">
                <td class="py-1 font-medium" x-text="sc"></td>
                <td class="py-1" x-text="d.hits[sc]?.hit ? 'ja' : 'nein'"></td>
                <td class="py-1 text-gray-600" x-text="d.hits[sc]?.min_distance_m == null ? '—' : $store.app.formatDistance(d.hits[sc].min_distance_m)"></td>
            </tr>
        </template>
    </tbody>
</table>
<template x-if="d.uesg && d.uesg.zones.length">
    <div class="mt-4 text-sm">
        <div class="font-semibold text-gray-900">⚖️ Überschwemmungsgebiet (Wasserhaushaltsgesetz)</div>
        <ul class="mt-1 space-y-0.5">
            <template x-for="(z, i) in d.uesg.zones" :key="i">
                <li class="text-gray-700">
                    <span class="font-medium" x-text="z.kind_label"></span> — <span x-text="z.name || '—'"></span>
                    <span class="text-gray-500" x-show="z.amtsblatt || z.date" x-text="'(' + [z.amtsblatt, z.date ? 'Datenstand ' + z.date : null].filter(Boolean).join(', ') + ')'"></span>
                </li>
            </template>
        </ul>
        <p class="mt-1 text-xs text-gray-500" x-show="d.uesg.legal">Festgesetzt/vorläufig gesichert: Neubauten und Erweiterungen nur mit Ausnahmegenehmigung (§ 78 WHG), keine neuen Heizöltanks (§ 78c WHG), hochwasserangepasstes Bauen Pflicht.</p>
    </div>
</template>
<p class="mt-2 text-xs text-red-700" x-show="d.uesg && d.uesg.error">Überschwemmungsgebiete NRW derzeit nicht abrufbar.</p>
<p class="mt-3 text-xs text-gray-500">Overlays HQ100 / HQhäufig / HQextrem auf der Karte oben zuschaltbar.</p>
