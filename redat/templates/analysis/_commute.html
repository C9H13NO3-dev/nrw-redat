<div class="space-y-2">
    <template x-for="c in d.destinations" :key="c.name + c.address">
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
            <div>
                <div class="font-medium text-gray-900" x-text="c.name"></div>
                <div class="text-xs text-gray-500" x-text="c.address || ''"></div>
            </div>
            <div class="text-right">
                <div class="font-bold text-gray-900" x-text="c.time_minutes != null ? c.time_minutes + ' Min' : '?'"></div>
                <div class="text-sm text-gray-500" x-text="c.distance_km != null ? c.distance_km + ' km' : ''"></div>
            </div>
        </div>
    </template>
</div>
