<div class="flex items-center gap-4">
    <span class="px-3 py-1 rounded-full font-bold" :class="$store.app.getAirQualityColor(d.rating_color)" x-text="d.rating"></span>
    <div class="text-sm text-gray-500">Verfügbarkeit in der <span x-text="d.cell_m"></span> m-Rasterzelle, Anteil der Haushalte</div>
</div>

<div class="mt-4 space-y-2 text-sm" x-data="{ rows: [
    ['ftth_1000', 'Glasfaser (FTTB/H) ≥ 1 Gbit/s'],
    ['hh_1000', 'Festnetz ≥ 1 Gbit/s (alle Techniken)'],
    ['hh_400', 'Festnetz ≥ 400 Mbit/s'],
    ['hh_100', 'Festnetz ≥ 100 Mbit/s'],
] }">
    <template x-for="[key, label] in rows" :key="key">
        <div class="flex items-center gap-3">
            <span class="w-64 text-gray-700" x-text="label"></span>
            <div class="flex gap-0.5">
                <template x-for="i in 5" :key="i">
                    <span class="w-5 h-2.5 rounded-sm" :class="d.fixed[key] && i <= d.fixed[key].step ? (key === 'ftth_1000' ? 'bg-indigo-500' : 'bg-blue-500') : 'bg-gray-200'"></span>
                </template>
            </div>
            <span class="w-20 text-right font-medium text-gray-900" x-text="d.fixed[key] ? d.fixed[key].label : '—'"></span>
        </div>
    </template>
</div>

<div class="mt-4 text-sm">
    <span class="text-gray-700">5G-Mobilfunk am Haus:</span>
    <template x-for="[key, label] in [['telekom', 'Telekom'], ['vodafone', 'Vodafone'], ['o2', 'o2'], ['1u1', '1&1']]" :key="key">
        <span class="inline-block ml-2 px-2 py-0.5 rounded-full text-xs font-semibold"
              :class="d.mobile_5g[key] === '5G' ? 'bg-green-100 text-green-800' : d.mobile_5g[key] ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-500'"
              x-text="label + ': ' + (d.mobile_5g[key] || 'kein 5G')"></span>
    </template>
</div>

<p class="mt-3 text-xs text-gray-500">
    <span x-text="d.attribution"></span> — Anbietermeldungen, keine Messung: „verfügbar“ heißt anschließbar, nicht angeschlossen.
    Konkrete Verfügbarkeit am Haus beim Anbieter prüfen ·
    <a class="underline" href="https://gigabitgrundbuch.bund.de/GIGA/DE/Breitbandatlas/start.html" target="_blank" rel="noopener">Breitbandatlas</a>
    <span x-show="Object.keys(d.errors || {}).length" x-text="' · nicht abrufbar: ' + Object.keys(d.errors).join(', ')"></span>
</p>
