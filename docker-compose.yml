services:
  redat:
    build:
      context: .
      target: runtime
    image: nrw-redat:latest
    container_name: nrw-redat
    ports:
      # Bound to localhost: Traefik reaches the container over the Docker network (the router's
      # `loadbalancer.server.port` label), not the published port. This also makes the login throttle,
      # the audit log's `ip` column and REDAT_TRUSTED_PROXIES meaningful — the app must not be
      # reachable except through Traefik (see HANDOVER "Known limitations").
      - "127.0.0.1:8200:8200"
    env_file: .env
    environment:
      REDAT_DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 2g
    init: true
